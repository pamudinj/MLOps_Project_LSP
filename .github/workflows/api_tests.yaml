name: API Tests

on:

  pull_request:
    branches:
      - main

    paths:
      - "src/pathmnist_mlops/api.py"
      - "tests/apitests/test_api.py"


jobs:

  api-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install \
            --upgrade pip setuptools wheel

          pip install -r requirements.txt
          pip install -r requirements_dev.txt

          pip install -e .

      - name: Run API tests
        run: |
          pytest tests/apitests/test_api.py
