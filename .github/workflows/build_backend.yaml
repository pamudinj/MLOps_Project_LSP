name: Build Backend Container

on:

  push:
    branches:
      - main

    paths:
      - "dockerfiles/backend.dockerfile"
      - "cloudbuild_backend.yaml"
      - ".github/workflows/build_backend.yaml"
      - "src/pathmnist_mlops/evaluate.py"
      - "src/pathmnist_mlops/export_onnx.py"
      - "src/pathmnist_mlops/api_onnx.py"


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install \
            --upgrade pip setuptools wheel

          pip install -r requirements_backend.txt

          pip install -e .

      - name: Export latest ONNX model
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
          WANDB_PROJECT: ${{ secrets.WANDB_PROJECT }}
        run: |
          python -m pathmnist_mlops.export_onnx

      - name: Verify ONNX model exists
        run: |
          test -f models/pathmnist_model.onnx

      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json:
            ${{ secrets.GCLOUD_SERVICE_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit cloud build
        run: |
          gcloud builds submit \
            . \
            --config \
            cloudbuild_backend.yaml \
            --async
