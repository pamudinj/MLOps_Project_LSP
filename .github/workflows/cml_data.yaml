name: DVC Workflow

on:

  pull_request:
    branches:
      - main

    paths:
      - "**/*.dvc"
      - ".dvc/**"


jobs:

  run_data_checker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install \
            --upgrade pip setuptools wheel

          pip install -r requirements.txt
          pip install -r requirements_dev.txt

          pip install -e .

      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json:
            ${{ secrets.GCP_SA_KEY }}

      - name: Pull data
        run: |
          dvc pull

      - name: Run dataset statistics
        run: |
          python -m \
            pathmnist_mlops.dataset_statistics
