displayName: "Low prediction confidence"
combiner: OR
conditions:
  - displayName: "Median confidence below 0.6 over 1 min"
    conditionThreshold:
      filter: 'metric.type="logging.googleapis.com/user/prediction_confidence" AND resource.type="cloud_run_revision"'
      comparison: COMPARISON_LT
      thresholdValue: 0.6
      duration: 60s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_PERCENTILE_50
