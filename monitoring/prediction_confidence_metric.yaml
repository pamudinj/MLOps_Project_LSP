description: Model prediction confidence from backend service
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="backend" AND jsonPayload.message="prediction"'
valueExtractor: EXTRACT(jsonPayload.confidence)
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "1"
bucketOptions:
  linearBuckets:
    numFiniteBuckets: 20
    width: 0.05
    offset: 0
